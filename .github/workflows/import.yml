#name: Import Events
run: node debug-detail-importer.js
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Node installieren
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Pakete installieren
        run: npm ci

      - name: Playwright Cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Playwright Browser installieren
        run: npx playwright install chromium

      - name: Importer starten
        run: node importer.js

      - name: Änderungen committen
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "Automatischer Event Import" || echo "Keine Änderungen"

          git push
import { chromium } from "playwright";
import fs from "fs";

const URL =
  "https://www.wasgehtapp.de/index.php?geo_id=15546&ort=Dettingen%20unter%20Teck&x=9.45&y=48.6167&einwohner=5603&region=01&select_ort=1&radius=40";

const MAX_EVENTS = 60;
const DETAIL_TIMEOUT_MS = 3000;
const RETRY_COUNT = 1;

const browser = await chromium.launch({
  headless: true,
});

const page = await browser.newPage();

const debugText = [];
const debugJson = [];

function log(line = "") {
  console.log(line);
  debugText.push(line);
}

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

function normalize(text) {
  return (text || "")
    .toLowerCase()
    .replace(/\s+/g, " ")
    .trim();
}

log("🔎 Debug Detail Importer V11");
log("Ziel: Speed-Test mit Vorab-Dublettenfilter");
log(`Max Events: ${MAX_EVENTS}`);
log("");

const globalStart = Date.now();

await page.goto(URL, {
  waitUntil: "domcontentloaded",
  timeout: 60000,
});

await page.waitForSelector(".termin.inline", {
  timeout: 15000,
});

const rawEvents = await page.$$eval(".termin.inline", (nodes) => {
  return nodes.map((node, index) => {
    const text = node.innerText || "";
    return {
      index,
      text,
    };
  });
});

log(`Gefundene Container: ${rawEvents.length}`);

// Vorab Dubletten filtern
const uniqueMap = new Map();

for (const item of rawEvents) {
  const key = normalize(item.text);

  if (!uniqueMap.has(key)) {
    uniqueMap.set(key, item);
  }
}

const uniqueEvents = [...uniqueMap.values()].slice(0, MAX_EVENTS);

log(`Eindeutige Container: ${uniqueEvents.length}`);
log("");

let okCount = 0;
let errorCount = 0;
let retryCount = 0;

for (let i = 0; i < uniqueEvents.length; i++) {
  const item = uniqueEvents[i];

  let success = false;
  let lastError = "";

  for (let retry = 0; retry <= RETRY_COUNT; retry++) {
    try {
      const cards = await page.$$(".termin.inline");

      const card = cards[item.index];

      if (!card) {
        throw new Error("Container nicht gefunden");
      }

      await card.scrollIntoViewIfNeeded();

      const oldHeadline = await page
        .$eval(".event_detail h1", (el) => el.innerText)
        .catch(() => "");

      await card.click();

      await page.waitForFunction(
        (previousHeadline) => {
          const h1 = document.querySelector(".event_detail h1");
          if (!h1) return false;

          const text = h1.innerText?.trim();
          return text && text !== previousHeadline;
        },
        oldHeadline,
        {
          timeout: DETAIL_TIMEOUT_MS,
        }
      );

      const detail = await page.evaluate(() => {
        const headline =
          document.querySelector(".event_detail h1")?.innerText?.trim() || "";

        const meta =
          document
            .querySelector(".event_detail")
            ?.innerText?.split("\n")
            ?.slice(0, 8) || [];

        const mapLinks = [
          ...document.querySelectorAll('.event_detail a[href*="daddr="]'),
        ].map((a) => a.href);

        return {
          headline,
          meta,
          mapLinks,
        };
      });

      const locationLine =
        detail.meta.find(
          (line) =>
            line.includes("map") ||
            line.includes("link") ||
            line.includes(",")
        ) || "";

      let lat = null;
      let lon = null;

      // WICHTIG: letzter Map-Link = aktiver Eventblock
      const lastMapLink = detail.mapLinks[detail.mapLinks.length - 1];

      if (lastMapLink) {
        const match = lastMapLink.match(/daddr=([0-9.\-]+),([0-9.\-]+)/);

        if (match) {
          lat = Number(match[1]);
          lon = Number(match[2]);
        }
      }

      log(
        `${String(i + 1).padStart(3, "0")}. OK | ${detail.headline} | ${lat}, ${lon}`
      );

      debugJson.push({
        nr: i + 1,
        status: "OK",
        title: detail.headline,
        lat,
        lon,
      });

      okCount++;
      success = true;
      break;
    } catch (err) {
      lastError = err.message;

      if (retry < RETRY_COUNT) {
        retryCount++;
        await sleep(500);
      }
    }
  }

  if (!success) {
    errorCount++;

    log(
      `${String(i + 1).padStart(3, "0")}. FEHLER | ${lastError}`
    );

    debugJson.push({
      nr: i + 1,
      status: "FEHLER",
      error: lastError,
    });
  }
}

const duration = ((Date.now() - globalStart) / 1000).toFixed(1);

log("");
log("========== ZUSAMMENFASSUNG ==========");
log(`Events getestet: ${uniqueEvents.length}`);
log(`OK: ${okCount}`);
log(`Fehler: ${errorCount}`);
log(`Retries: ${retryCount}`);
log(`Dauer: ${duration}s`);
log(
  `Ø Sekunden/Event: ${(Number(duration) / uniqueEvents.length).toFixed(2)}`
);

fs.writeFileSync("debug-output.txt", debugText.join("\n"));
fs.writeFileSync(
  "debug-output.json",
  JSON.stringify(debugJson, null, 2)
);

await browser.close();
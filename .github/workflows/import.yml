name: Import Events

on:
  workflow_dispatch:

jobs:
  fast-import:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node installieren
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencies installieren
        run: npm install

      - name: Playwright Browser installieren
        run: npx playwright install chromium

      - name: Fast Importer starten
        run: node import-fast.js

      - name: Upload debug files
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            debug-output.txt
            debug-output.json

      - name: Debug Dateien committen
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add debug-output.txt
          git add debug-output.json

          git commit -m "update debug output" || echo "Keine Änderungen"

          git push

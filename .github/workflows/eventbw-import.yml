name: EventBW Import

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: Optionales Zieldatum YYYY-MM-DD; leer = heute Sonntag sonst kommender Sonntag
        required: false
        type: string

      radius_km:
        description: Aktuell nicht genutzt
        required: false
        default: '40'
        type: string

  schedule:
    - cron: '15 5 * * *'

permissions:
  contents: write

jobs:
  eventbw-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run EventBW importer
        env:
          EVENTBW_TARGET_DATE: ${{ inputs.target_date }}
          EVENTBW_RADIUS_KM: ${{ inputs.radius_km || '40' }}
          EVENTBW_SEARCH_PLACE: 'Dettingen Teck'
          EVENTBW_MAX_PAGES_PER_CATEGORY: '300'
          EVENTBW_FETCH_TIMEOUT_MS: '15000'
        run: |
          node eventbw/import-eventbw.cjs

      - name: Upload EventBW output artifact
        uses: actions/upload-artifact@v5
        with:
          name: eventbw-output
          if-no-files-found: warn
          path: |
            eventbw/01-raw-import.json
            eventbw/01-raw-import.txt
            eventbw/02-zieldatum.json
            eventbw/02-zieldatum.txt
            eventbw/debug-output.json
            eventbw/debug-output.txt
            eventbw/feste-maerkte.json
            eventbw/feste-maerkte.txt
            eventbw/html/**

      - name: Commit updated EventBW outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add eventbw/01-raw-import.json || true
          git add eventbw/01-raw-import.txt || true
          git add eventbw/02-zieldatum.json || true
          git add eventbw/02-zieldatum.txt || true
          git add eventbw/debug-output.json || true
          git add eventbw/debug-output.txt || true
          git add eventbw/feste-maerkte.json || true
          git add eventbw/feste-maerkte.txt || true
          git add eventbw/html || true

          if [[ -n "$(git status --porcelain)" ]]; then
            git commit -m "Update EventBW import outputs"
            git push
          else
            echo "No EventBW output changes."
          fi
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lokalevents</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="map"></div>

<div class="top">
  <h1>Lokalevents</h1>
  <p id="status">Kirchheim unter Teck • Radius 50 km</p>

  <div class="controls">
    <select id="dateSelect">
      <option value="all">Alle Events</option>
      <option value="today">Heute</option>
      <option value="tomorrow">Morgen</option>
      <option value="sunday" selected>Kommender Sonntag</option>
    </select>

    <div class="radius-control">
      <span id="radiusLabel">50 km</span>
      <input id="radiusSlider" type="range" min="5" max="100" value="50">
    </div>
  </div>
</div>

<div class="cards" id="cards"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="events.js"></script>
<script src="app.js"></script>

</body>
</html>

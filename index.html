<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lokalevents</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body,#map{
  margin:0;
  height:100%;
  font-family:-apple-system,Arial;
}

.top{
  position:absolute;
  top:20px;
  left:12px;
  right:12px;
  background:white;
  padding:14px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
  z-index:1000;
}

.cards{
  position:absolute;
  left:0;
  right:0;
  bottom:20px;
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:0 14px;
  z-index:1000;
}

.card{
  min-width:230px;
  background:white;
  border-radius:20px;
  padding:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.card h3{
  margin:0;
}

.card p{
  margin:6px 0 0;
  color:#666;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="top">
  <h1 style="margin:0">Lokalevents</h1>
  <div>Kirchheim unter Teck · Radius 50 km</div>
</div>

<div class="cards">
  <div class="card">
    <h3>Markt Kirchheim</h3>
    <p>Heute · 2 km</p>
  </div>

  <div class="card">
    <h3>Stadtfest Nürtingen</h3>
    <p>Morgen · 18 km</p>
  </div>

  <div class="card">
    <h3>Festival Stuttgart</h3>
    <p>Kommende Tage · 36 km</p>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const center = [48.6468, 9.4538];

const map = L.map('map').setView(center, 10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

L.circle(center, {
  radius: 50000,
  color: '#007aff',
  fillColor: '#007aff',
  fillOpacity: 0.12
}).addTo(map);

L.marker([48.6468, 9.4538]).addTo(map).bindPopup("Markt Kirchheim");
L.marker([48.6259, 9.3420]).addTo(map).bindPopup("Stadtfest Nürtingen");
L.marker([48.7758, 9.1829]).addTo(map).bindPopup("Festival Stuttgart");
</script>

</body>
</html>

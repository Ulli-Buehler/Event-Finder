<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  />

  <title>Lokalevents</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <link
    rel="stylesheet"
    href="style.css?v=8003"
  />
</head>

<body>

  <div id="map"></div>

  <div class="top">

    <div class="top-header">
      <div>
        <h1>Lokalevents</h1>

        <p id="status">
          EventBW Märkte/Feste
        </p>

        <div class="creator-credit">
          by Ulli Bühler
        </div>
      </div>

      <button id="filterToggle" class="filter-toggle">
        Filter anzeigen
      </button>
    </div>

    <div id="filterPanel" class="filter-panel">

      <div class="controls">

        <select id="dateSelect">

          <option value="all">
            Alle geladenen Events
          </option>

          <option value="today">
            Heute
          </option>

          <option value="tomorrow">
            Morgen
          </option>

          <option value="sunday" selected>
            Zieldatum / Sonntag
          </option>

        </select>

        <div class="radius-control">

          <div id="radiusLabel">
            40 km
          </div>

          <input
            type="range"
            id="radiusSlider"
            min="5"
            max="120"
            value="40"
          />

        </div>

      </div>

      <button id="refreshBtn">
        🔄 Events aktualisieren
      </button>

    </div>

    <div id="importStatus">
      Bereit
    </div>

  </div>

  <div
    id="cards"
    class="cards"
  ></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="app.js?v=8003"></script>

</body>
</html>
